<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h1>Desenho Assinado</h1>

  <div id="botao-google"></div>
  <p id="usuario"></p>

  <form id="form">
    <label for="numero">Número (1 a 100)</label>
    <input id="numero" type="number" min="1" max="100" step="1" required />
    <button type="submit">Gerar desenho</button>
  </form>

  <p id="erro" role="alert"></p>
  <div id="resultado"></div>
  <a id="baixar" download="exemplo.svg" hidden>Baixar SVG</a>

  <script src="script.js"></script>
</body>
</html>
